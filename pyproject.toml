[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minja-repro"
version = "0.1.0"
description = "Independent implementation of MINJA (arXiv:2503.03704) and a re-analysis of its published intervals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Srivatsa Kamballa" }]
keywords = ["llm", "agents", "security", "memory-injection", "reproduction", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minja-repro = "minja_repro.cli:main"

[tool.setuptools]
packages = ["minja_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
